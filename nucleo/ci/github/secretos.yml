# Escaneo de secretos sobre los ficheros que el repositorio TRACKEA.
#
# Un secreto que aparece una vez en un commit está comprometido para siempre: el historial
# no se olvida, y reescribirlo no borra los forks ni las copias. Por eso el escaneo va
# antes del merge, no después del incidente.
name: secretos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Buscar secretos en ficheros trackeados
        run: node agente/tools/secretos.mjs

      - name: El remoto no lleva credenciales embebidas
        # Caso real: una URL de remoto con el token dentro, visible en cualquier
        # `git remote -v` y en cualquier copia del directorio.
        run: |
          if git remote -v | grep -qE '://[^/@[:space:]]+:?[^/@[:space:]]*@'; then
            echo "✗ el remoto lleva credenciales en la URL — rotar el token y limpiarlo"
            exit 1
          fi
          echo "✓ remoto limpio"
